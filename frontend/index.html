<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#55704b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaizen</title>
    <meta name="description" content="We are what we practice, not what we think we are." />
    <!-- apply the saved theme before first paint so there is no flash of the wrong one -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("habit-theme");
          if (t !== "light" && t !== "dark" && t !== "night") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
